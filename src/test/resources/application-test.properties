# Testes: H2 em memória, sem precisar do MySQL
spring.datasource.url=jdbc:h2:mem:sislab-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Não sobe o servidor do front-end durante os testes (evita conflito de porta)
sislab.frontend.habilitado=false
