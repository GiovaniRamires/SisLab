spring.application.name=sislab
spring.datasource.url=jdbc:h2:mem:sislab
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Inclui a mensagem das ResponseStatusException no corpo de erro (exibida pelo front-end)
spring.web.error.include-message=always

# Origens do front-end autorizadas a consumir a API (CORS com credenciais), separadas por vírgula.
# Aceita padrões, ex.: http://localhost:*
sislab.cors.allowed-origins=http://localhost:*,http://127.0.0.1:*
