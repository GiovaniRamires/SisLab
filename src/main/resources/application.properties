spring.application.name=sislab

# ---- Portas ----
# Backend (API): 8080
server.port=8080

# Frontend: ao iniciar o backend, a pasta frontend/ também é servida nesta porta.
# O caminho da pasta é relativo ao diretório de execução (raiz do projeto).
sislab.frontend.habilitado=true
sislab.frontend.porta=5500
sislab.frontend.pasta=frontend

# ---- Banco de dados (MySQL) ----
# O banco "sislab" é criado automaticamente se não existir. Ajuste usuário e senha ao seu MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/sislab?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
# Cria e ajusta as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update

# ---- JWT ----
# Segredo de assinatura (mínimo de 32 caracteres) e validade do token em minutos
sislab.jwt.secret=sislab-segredo-academico-troque-este-valor-32chars
sislab.jwt.expiracao-minutos=60

# ---- Administrador inicial ----
# Criado na inicialização se ainda não existir nenhum ADMINISTRADOR (o cadastro público não cria administradores)
sislab.admin-inicial.nome=Administrador SisLab
sislab.admin-inicial.email=admin@instituicao.edu.br
sislab.admin-inicial.rgm=00000001
sislab.admin-inicial.senha=sislab123

# ---- CORS ----
# Origem do frontend (acompanha a porta definida acima)
sislab.cors.allowed-origins=http://localhost:${sislab.frontend.porta},http://127.0.0.1:${sislab.frontend.porta}

# Inclui a mensagem das ResponseStatusException no corpo de erro (exibida pelo front-end)
spring.web.error.include-message=always
